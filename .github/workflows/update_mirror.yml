name: Automated Payloads Mirror

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

concurrency:
  group: update-mirror
  cancel-in-progress: false

jobs:
  update-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate payloads.json
        run: python validate_payloads.py

      - name: Run Payloads Update Script
        run: python update_payloads.py

      - name: Create release if missing
        run: |
          gh release view payloads-mirror >/dev/null 2>&1 || \
            gh release create payloads-mirror --title "Payloads Mirror" --notes "Automated mirror of payloads."

      - name: Upload payload binaries
        run: |
          if [ -d payloads ] && [ -n "$(ls -A payloads)" ]; then
            gh release upload payloads-mirror payloads/* --clobber
          else
            echo "No payloads to upload."
          fi

      - name: Remove stale release assets
        run: python update_payloads.py --cleanup

      - name: Commit and push metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payloads.json README.md download_stats.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update payloads.json metadata"
          git pull --rebase
          git push
